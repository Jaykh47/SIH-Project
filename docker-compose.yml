version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: landstack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: landstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landstack-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: landstack
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: landstack_super_secret_jwt_key_sih_2026_demo
      RATE_LIMIT_MAX_REQUESTS: 500
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: landstack-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: landstack-ai
    restart: unless-stopped
    ports:
      - "8001:8001"

volumes:
  pgdata:
